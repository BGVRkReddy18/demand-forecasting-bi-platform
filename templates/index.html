<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForecastIQ - Demand Forecasting &amp; Business Intelligence</title>
<meta name="description" content="Retail demand forecasting platform: global gradient boosting, conformal prediction intervals, inventory optimisation and price-elasticity analytics.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M6 22l6-7 5 4 9-11' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v={{ version }}">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--series-1)"/><path d="M6 22l6-7 5 4 9-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>ForecastIQ</b><span>Demand &amp; BI platform</span></div>
    </div>
    <nav id="nav" aria-label="Sections">
      <button data-page="overview">Overview</button>
      <button data-page="forecast">Forecast explorer</button>
      <button data-page="models">Model performance</button>
      <button data-page="inventory">Inventory planning</button>
      <button data-page="pricing">Pricing &amp; promotions</button>
      <button data-page="anomalies">Anomaly monitor</button>
      <button data-page="upload">Forecast your data</button>
      <button data-page="about">Methodology</button>
    </nav>
    <div class="side-foot">
      <button id="theme" class="ghost" type="button">Switch theme</button>
      <p id="stamp"></p>
    </div>
  </aside>
  <main>
    <header class="top">
      <div><h1 id="title"></h1><p id="subtitle"></p></div>
      <div class="pill" id="datapill" title="The demo runs on simulated retail data with known ground truth">Simulated data</div>
    </header>
    <div id="view" class="viz-root"></div>
  </main>
</div>
<div id="tip" role="status"></div>
<script src="{{ url_for('static', filename='charts.js') }}?v={{ version }}"></script>
<script src="{{ url_for('static', filename='app.js') }}?v={{ version }}"></script>
</body>
</html>
